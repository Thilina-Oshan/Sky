<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/productcard.css">
</head>

<body>

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <section class="py-5 bg-light">
        <div class="container py-4">
            <h2 class="text-center fw-bold mb-4">Shop by Category</h2>
            <div class="row g-4">
                <div class="col-md-4 mb-4">
                    <div class="card bg-dark text-white border-0 overflow-hidden custom-product-card shadow">
                        <!-- Image -->
                        <img src="/img/mensware.jpg" class="card-img object-fit-cover" alt="Men's Wear"
                            style="height: 350px;">

                        <!-- Overlay Layer -->
                        <div class="card-img-overlay d-flex flex-column justify-content-end p-4 gradient-overlay">
                            <h4 class="card-title fw-bold mb-3">Men's Collection</h4>
                            <div>
                                <a href="/pages/menscollection.html"
                                    class="btn btn-light fw-semibold px-4 rounded-pill">See
                                    More</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card bg-dark text-white border-0 overflow-hidden custom-product-card shadow">
                        <!-- Image -->
                        <img src="/img/womenCollction.avif" class="card-img object-fit-cover" alt="women's Wear"
                            style="height: 350px;">

                        <!-- Overlay Layer -->
                        <div class="card-img-overlay d-flex flex-column justify-content-end p-4 gradient-overlay">
                            <h4 class="card-title fw-bold mb-3">Women's Collection</h4>
                            <div>
                                <a href="/pages/collection.html" class="btn btn-light fw-semibold px-4 rounded-pill">See
                                    More</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card bg-dark text-white border-0 overflow-hidden custom-product-card shadow">
                        <!-- Image -->
                        <img src="/img/accessories.jpg" class="card-img object-fit-cover" alt="Accessories"
                            style="height: 350px;">

                        <!-- Overlay Layer -->
                        <div class="card-img-overlay d-flex flex-column justify-content-end p-4 gradient-overlay">
                            <h4 class="card-title fw-bold mb-3">Accessories</h4>
                            <div>
                                <a href="/pages/menscollection.html"
                                    class="btn btn-light fw-semibold px-4 rounded-pill">See
                                    More</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/product.js"></script>


</body>

</html>
