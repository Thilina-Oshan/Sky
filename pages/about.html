<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/aboutus.css">
    <title>About Us</title>
</head>

<body>
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Wrapper -->
    <main class="flex-grow-1 mt-5">
        <div class="about-container">
            <header class="about-header">
                <div class="title">
                    <h3 class="fw-bold text-uppercase">The Creative Crew</h3>
                </div>
                <div class="content">
                    <h5 class="text-uppercase text-muted">Who We Are</h5>
                    <p class="lead">We are a team of creatively diverse, driven, and innovative individuals working from various locations around the world.</p>
                </div>
            </header>

            <div class="team-grid">
                <div class="profile">
                    <figure data-value="Product Owner">
                        <img src="https://rvs-team-page.onrender.com/photo1.png" class="img-fluid rounded" alt="Bill Mahoney">
                        <figcaption>Bill Mahoney</figcaption>
                    </figure>
                </div>

                <div class="profile">
                    <figure data-value="Art Director">
                        <img src="https://rvs-team-page.onrender.com/photo2.png" class="img-fluid rounded" alt="Saba Cabrera">
                        <figcaption>Saba Cabrera</figcaption>
                    </figure>
                </div>

                <div class="profile">
                    <figure data-value="Tech Lead">
                        <img src="https://rvs-team-page.onrender.com/photo3.png" class="img-fluid rounded" alt="Shae Le">
                        <figcaption>Shae Le</figcaption>
                    </figure>
                </div>

                <div class="profile">
                    <figure data-value="UX Designer">
                        <img src="https://rvs-team-page.onrender.com/photo4.png" class="img-fluid rounded" alt="Skylah Lu">
                        <figcaption>Skylah Lu</figcaption>
                    </figure>
                </div>

                <div class="profile">
                    <figure data-value="Developer">
                        <img src="https://rvs-team-page.onrender.com/photo5.png" class="img-fluid rounded" alt="Griff Richards">
                        <figcaption>Griff Richards</figcaption>
                    </figure>
                </div>

                <div class="profile">
                    <figure data-value="Developer">
                        <img src="https://rvs-team-page.onrender.com/photo6.png" class="img-fluid rounded" alt="Stan John">
                        <figcaption>Stan John</figcaption>
                    </figure>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder Outside Main Wrapper -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>

</html>
