<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Stock Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/stockmanagement.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="icon" href="/assets/img/logo-removebg.png" type="image/png">
</head>

<body>

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <div class="container pt-5 mt-5 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="fw-bold mb-1">Stock Management</h1>
                <p class="text-muted mb-0">Track and update inventory across Men's, Women's &amp; Accessories
                    collections.</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-success btn-sm" id="exportExcelBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                        class="bi bi-file-earmark-excel me-1" viewBox="0 0 16 16" style="margin-bottom:2px;">
                        <path
                            d="M5.884 6.68a.5.5 0 1 0-.768.64L7.349 10l-2.233 2.68a.5.5 0 0 0 .768.64L8 10.781l2.116 2.54a.5.5 0 0 0 .768-.641L8.651 10l2.233-2.68a.5.5 0 0 0-.768-.64L8 9.219l-2.116-2.54Z" />
                        <path
                            d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1" />
                    </svg>
                    Export to Excel
                </button>
                <a href="/admin/mensclothingform.html" class="btn btn-primary btn-sm">+ Add Product</a>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <div class="summary-label">Total Products</div>
                    <div class="summary-value" id="summaryTotal">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <div class="summary-label">Total Units in Stock</div>
                    <div class="summary-value" id="summaryUnits">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card warn-border">
                    <div class="summary-label">Low Stock Items</div>
                    <div class="summary-value" id="summaryLow">0</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card alert-border">
                    <div class="summary-label">Out of Stock</div>
                    <div class="summary-value" id="summaryOut">0</div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-4">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search by product name or SKU...">
                </div>
                <div class="col-6 col-md-2">
                    <select id="collectionFilter" class="form-select">
                        <option value="">All Collections</option>
                        <option value="Men's">Men's</option>
                        <option value="Women's">Women's</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="in-stock">In Stock</option>
                        <option value="low">Low Stock</option>
                        <option value="out">Out of Stock</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="lowThresholdInput" class="visually-hidden">Low stock threshold</label>
                    <div class="input-group">
                        <span class="input-group-text">Low &lt;</span>
                        <input type="number" id="lowThresholdInput" class="form-control" value="10" min="1">
                    </div>
                </div>
            </div>
        </div>

        <!-- Stock Table -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="stockTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Collection</th>
                            <th>Category</th>
                            <th>SKU</th>
                            <th>Price (Rs)</th>
                            <th>Stock Qty</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/product.js"></script>
    <script src="/assets/js/stockmanagement.js"></script>

</body>

</html>
